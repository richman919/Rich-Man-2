<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RichMan - Financial Investment Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black bg-gradient-to-r from-green-400 to-emerald-500 bg-clip-text text-transparent">RichMan</span>
                <span class="text-xs bg-green-500/10 text-green-400 px-2.5 py-1 rounded-full border border-green-500/20 font-medium">Live Dashboard</span>
            </div>
            <div class="text-sm text-slate-400">
                স্বাগতম, <span class="text-slate-200 font-semibold">ইনভেস্টর</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <p class="text-slate-400 text-sm font-medium">মোট বিনিয়োগ (Total Investment)</p>
                <h3 id="totalInvestment" class="text-3xl font-bold mt-2 text-white">৳ 0.00</h3>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <p class="text-slate-400 text-sm font-medium">মোট প্রফিট (Total Profit)</p>
                <h3 id="totalProfit" class="text-3xl font-bold mt-2 text-green-400">৳ 0.00</h3>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <p class="text-slate-400 text-sm font-medium">ব্যালেন্স (Current Balance)</p>
                <h3 id="currentBalance" class="text-3xl font-bold mt-2 text-emerald-400">৳ 0.00</h3>
            </div>
        </div>

        <!-- Action Section -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold mb-6 text-slate-200">নতুন ইনভেস্টমেন্ট যোগ করুন</h2>
            <form id="investmentForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">প্ল্যানের নাম / বিবরণ</label>
                    <input type="text" id="planName" required placeholder="যেমন: প্রজেক্ট আলফা" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-2">বিনিয়োগের পরিমাণ (৳)</label>
                    <input type="number" id="investmentAmount" required placeholder="5000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-green-500">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-lg shadow-green-600/20">যুক্ত করুন</button>
                </div>
            </form>
        </div>

        <!-- Investment History Table -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-xl overflow-hidden">
            <h2 class="text-xl font-bold mb-4 text-slate-200">ইনভেস্টমেন্ট লিস্ট</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-sm">
                            <th class="py-3 px
